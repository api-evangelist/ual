aid: ual
name: Ualá
description: >-
  Ualá is a Latin American fintech founded in Argentina in 2017 by Pierpaolo Barbieri, offering
  a neobank super-app (prepaid and credit cards, savings, investments, loans, insurance) in
  Argentina and Mexico, where it operates as Ualá ABC through the acquired ABC Capital bank.
  Its merchant arm, Ualá Bis, provides payments acceptance — link de pago, POS, e-commerce
  plugins, and the API Cobros Online v2, a checkout API with hosted payment links, order
  retrieval and listing, refunds, and webhook status notifications, documented at
  developers.ualabis.com.ar with official Node.js and PHP SDKs.
